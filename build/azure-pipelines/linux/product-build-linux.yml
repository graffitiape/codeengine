parameters:
  - name: NPM_ARCH
    type: string
  - name: CODEENGINE_ARCH
    type: string
  - name: CODEENGINE_CIBUILD
    type: boolean
  - name: CODEENGINE_QUALITY
    type: string
  - name: CODEENGINE_BUILD_LINUX_SNAP
    type: boolean
    default: false
  - name: CODEENGINE_RUN_ELECTRON_TESTS
    type: boolean
    default: false
  - name: CODEENGINE_RUN_BROWSER_TESTS
    type: boolean
    default: false
  - name: CODEENGINE_RUN_REMOTE_TESTS
    type: boolean
    default: false
  - name: CODEENGINE_RUN_CHECKS
    type: boolean
    default: false

jobs:
  - job: Linux_${{ parameters.CODEENGINE_ARCH }}
    displayName: Linux (${{ upper(parameters.CODEENGINE_ARCH) }})
    timeoutInMinutes: 90
    variables:
      DISPLAY: ":10"
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
      NPM_ARCH: ${{ parameters.NPM_ARCH }}
      CODEENGINE_ARCH: ${{ parameters.CODEENGINE_ARCH }}
    templateContext:
      sdl:
        binskim:
          analyzeTargetGlob: '$(Agent.BuildDirectory)/VSCode-linux-$(CODEENGINE_ARCH)/**/*.node;$(Agent.BuildDirectory)/vscode-server-linux-$(CODEENGINE_ARCH)/**/*.node;$(Agent.BuildDirectory)/vscode-server-linux-$(CODEENGINE_ARCH)-web/**/*.node'
          preReleaseVersion: '4.3.1'
      outputParentDirectory: $(Build.ArtifactStagingDirectory)/out
      outputs:
        - ${{ if or(eq(parameters.CODEENGINE_RUN_ELECTRON_TESTS, true), eq(parameters.CODEENGINE_RUN_BROWSER_TESTS, true), eq(parameters.CODEENGINE_RUN_REMOTE_TESTS, true)) }}:
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/crashes
            artifactName: crash-dump-linux-$(CODEENGINE_ARCH)-$(System.JobAttempt)
            displayName: Publish Crash Reports
            sbomEnabled: false
            isProduction: false
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/node_modules
            artifactName: node-modules-linux-$(CODEENGINE_ARCH)-$(System.JobAttempt)
            displayName: Publish Node Modules
            sbomEnabled: false
            isProduction: false
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/logs
            artifactName: logs-linux-$(CODEENGINE_ARCH)-$(System.JobAttempt)
            displayName: Publish Log Files
            sbomEnabled: false
            isProduction: false
            condition: succeededOrFailed()
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/client/$(CLIENT_ARCHIVE_NAME)
          artifactName: vscode_client_linux_$(CODEENGINE_ARCH)_archive-unsigned
          displayName: Publish client archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/VSCode-linux-$(CODEENGINE_ARCH)
          sbomPackageName: "Code Engine Linux $(CODEENGINE_ARCH) (unsigned)"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/server/vscode-server-linux-$(CODEENGINE_ARCH).tar.gz
          artifactName: vscode_server_linux_$(CODEENGINE_ARCH)_archive-unsigned
          displayName: Publish server archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-linux-$(CODEENGINE_ARCH)
          sbomPackageName: "Code Engine Linux $(CODEENGINE_ARCH) Server"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/web/vscode-server-linux-$(CODEENGINE_ARCH)-web.tar.gz
          artifactName: vscode_web_linux_$(CODEENGINE_ARCH)_archive-unsigned
          displayName: Publish web server archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-linux-$(CODEENGINE_ARCH)-web
          sbomPackageName: "Code Engine Linux $(CODEENGINE_ARCH) Web"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/deb/$(DEB_PACKAGE_NAME)
          artifactName: vscode_client_linux_$(CODEENGINE_ARCH)_deb-package
          displayName: Publish deb package
          sbomBuildDropPath: .build/linux/deb
          sbomPackageName: "Code Engine Linux $(CODEENGINE_ARCH) DEB"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/rpm/$(RPM_PACKAGE_NAME)
          artifactName: vscode_client_linux_$(CODEENGINE_ARCH)_rpm-package
          displayName: Publish rpm package
          sbomBuildDropPath: .build/linux/rpm
          sbomPackageName: "Code Engine Linux $(CODEENGINE_ARCH) RPM"
          sbomPackageVersion: $(Build.SourceVersion)
        - ${{ if eq(parameters.CODEENGINE_BUILD_LINUX_SNAP, true) }}:
          - output: pipelineArtifact
            targetPath: $(Build.ArtifactStagingDirectory)/out/snap/$(SNAP_PACKAGE_NAME)
            artifactName: vscode_client_linux_$(CODEENGINE_ARCH)_snap
            displayName: Publish snap package
            sbomBuildDropPath: $(SNAP_EXTRACTED_PATH)
            sbomPackageName: "Code Engine Linux $(CODEENGINE_ARCH) SNAP"
            sbomPackageVersion: $(Build.SourceVersion)
    steps:
      - template: ./steps/product-build-linux-compile.yml@self
        parameters:
          CODEENGINE_ARCH: ${{ parameters.CODEENGINE_ARCH }}
          CODEENGINE_CIBUILD: ${{ parameters.CODEENGINE_CIBUILD }}
          CODEENGINE_QUALITY: ${{ parameters.CODEENGINE_QUALITY }}
          CODEENGINE_BUILD_LINUX_SNAP: ${{ parameters.CODEENGINE_BUILD_LINUX_SNAP }}
          CODEENGINE_RUN_ELECTRON_TESTS: ${{ parameters.CODEENGINE_RUN_ELECTRON_TESTS }}
          CODEENGINE_RUN_BROWSER_TESTS: ${{ parameters.CODEENGINE_RUN_BROWSER_TESTS }}
          CODEENGINE_RUN_REMOTE_TESTS: ${{ parameters.CODEENGINE_RUN_REMOTE_TESTS }}
          CODEENGINE_RUN_CHECKS: ${{ parameters.CODEENGINE_RUN_CHECKS }}
