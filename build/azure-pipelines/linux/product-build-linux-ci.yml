parameters:
  - name: CODEENGINE_CIBUILD
    type: boolean
  - name: CODEENGINE_QUALITY
    type: string
  - name: CODEENGINE_TEST_SUITE
    type: string
  - name: CODEENGINE_RUN_CHECKS
    type: boolean
    default: false

jobs:
  - job: Linux${{ parameters.CODEENGINE_TEST_SUITE }}
    displayName: ${{ parameters.CODEENGINE_TEST_SUITE }} Tests
    timeoutInMinutes: 30
    variables:
      DISPLAY: ":10"
      NPM_ARCH: x64
      CODEENGINE_ARCH: x64
    templateContext:
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/crashes
          artifactName: crash-dump-linux-$(CODEENGINE_ARCH)-${{ lower(parameters.CODEENGINE_TEST_SUITE) }}-$(System.JobAttempt)
          displayName: Publish Crash Reports
          sbomEnabled: false
          isProduction: false
          condition: failed()
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/node_modules
          artifactName: node-modules-linux-$(CODEENGINE_ARCH)-${{ lower(parameters.CODEENGINE_TEST_SUITE) }}-$(System.JobAttempt)
          displayName: Publish Node Modules
          sbomEnabled: false
          isProduction: false
          condition: failed()
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)/.build/logs
          artifactName: logs-linux-$(CODEENGINE_ARCH)-${{ lower(parameters.CODEENGINE_TEST_SUITE) }}-$(System.JobAttempt)
          displayName: Publish Log Files
          sbomEnabled: false
          isProduction: false
          condition: succeededOrFailed()
    steps:
      - template: ./steps/product-build-linux-compile.yml@self
        parameters:
          CODEENGINE_ARCH: x64
          CODEENGINE_CIBUILD: ${{ parameters.CODEENGINE_CIBUILD }}
          CODEENGINE_QUALITY: ${{ parameters.CODEENGINE_QUALITY }}
          CODEENGINE_RUN_CHECKS: ${{ parameters.CODEENGINE_RUN_CHECKS }}
          ${{ if eq(parameters.CODEENGINE_TEST_SUITE, 'Electron') }}:
            CODEENGINE_RUN_ELECTRON_TESTS: true
          ${{ if eq(parameters.CODEENGINE_TEST_SUITE, 'Browser') }}:
            CODEENGINE_RUN_BROWSER_TESTS: true
          ${{ if eq(parameters.CODEENGINE_TEST_SUITE, 'Remote') }}:
            CODEENGINE_RUN_REMOTE_TESTS: true
