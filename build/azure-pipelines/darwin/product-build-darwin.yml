parameters:
  - name: CODEENGINE_ARCH
    type: string
  - name: CODEENGINE_CIBUILD
    type: boolean
  - name: CODEENGINE_RUN_ELECTRON_TESTS
    type: boolean
    default: false
  - name: CODEENGINE_RUN_BROWSER_TESTS
    type: boolean
    default: false
  - name: CODEENGINE_RUN_REMOTE_TESTS
    type: boolean
    default: false

jobs:
  - job: macOS_${{ parameters.CODEENGINE_ARCH }}
    displayName: macOS (${{ upper(parameters.CODEENGINE_ARCH) }})
    timeoutInMinutes: 90
    variables:
      CODEENGINE_ARCH: ${{ parameters.CODEENGINE_ARCH }}
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputParentDirectory: $(Build.ArtifactStagingDirectory)/out
      outputs:
        - ${{ if or(eq(parameters.CODEENGINE_RUN_ELECTRON_TESTS, true), eq(parameters.CODEENGINE_RUN_BROWSER_TESTS, true), eq(parameters.CODEENGINE_RUN_REMOTE_TESTS, true)) }}:
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/crashes
            artifactName: crash-dump-macos-$(CODEENGINE_ARCH)-$(System.JobAttempt)
            displayName: "Publish Crash Reports"
            sbomEnabled: false
            isProduction: false
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/node_modules
            artifactName: node-modules-macos-$(CODEENGINE_ARCH)-$(System.JobAttempt)
            displayName: "Publish Node Modules"
            sbomEnabled: false
            isProduction: false
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/logs
            artifactName: logs-macos-$(CODEENGINE_ARCH)-$(System.JobAttempt)
            displayName: "Publish Log Files"
            sbomEnabled: false
            isProduction: false
            condition: succeededOrFailed()
        - output: pipelineArtifact
          ${{ if eq(parameters.CODEENGINE_ARCH, 'x64') }}:
            targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_client_darwin_$(CODEENGINE_ARCH)_archive/VSCode-darwin.zip
          ${{ if eq(parameters.CODEENGINE_ARCH, 'arm64') }}:
            targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_client_darwin_$(CODEENGINE_ARCH)_archive/VSCode-darwin-arm64.zip
          artifactName: vscode_client_darwin_$(CODEENGINE_ARCH)_archive
          displayName: Publish client archive
          sbomBuildDropPath: $(Build.ArtifactStagingDirectory)/VSCode-darwin-$(CODEENGINE_ARCH)
          sbomPackageName: "Code Engine macOS $(CODEENGINE_ARCH)"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_server_darwin_$(CODEENGINE_ARCH)_archive/vscode-server-darwin-$(CODEENGINE_ARCH).zip
          artifactName: vscode_server_darwin_$(CODEENGINE_ARCH)_archive
          displayName: Publish server archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-darwin-$(CODEENGINE_ARCH)
          sbomPackageName: "Code Engine macOS $(CODEENGINE_ARCH) Server"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_web_darwin_$(CODEENGINE_ARCH)_archive/vscode-server-darwin-$(CODEENGINE_ARCH)-web.zip
          artifactName: vscode_web_darwin_$(CODEENGINE_ARCH)_archive
          displayName: Publish web server archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-darwin-$(CODEENGINE_ARCH)-web
          sbomPackageName: "Code Engine macOS $(CODEENGINE_ARCH) Web"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/vscode_client_darwin_$(CODEENGINE_ARCH)_dmg/VSCode-darwin-$(CODEENGINE_ARCH).dmg
          artifactName: vscode_client_darwin_$(CODEENGINE_ARCH)_dmg
          displayName: Publish client DMG
          sbomBuildDropPath: $(Build.ArtifactStagingDirectory)/VSCode-darwin-$(CODEENGINE_ARCH)
          sbomPackageName: "Code Engine macOS $(CODEENGINE_ARCH)"
          sbomPackageVersion: $(Build.SourceVersion)
    steps:
      - template: ./steps/product-build-darwin-compile.yml@self
        parameters:
          CODEENGINE_ARCH: ${{ parameters.CODEENGINE_ARCH }}
          CODEENGINE_CIBUILD: ${{ parameters.CODEENGINE_CIBUILD }}
          CODEENGINE_RUN_ELECTRON_TESTS: ${{ parameters.CODEENGINE_RUN_ELECTRON_TESTS }}
          CODEENGINE_RUN_BROWSER_TESTS: ${{ parameters.CODEENGINE_RUN_BROWSER_TESTS }}
          CODEENGINE_RUN_REMOTE_TESTS: ${{ parameters.CODEENGINE_RUN_REMOTE_TESTS }}
