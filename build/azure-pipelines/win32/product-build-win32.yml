parameters:
  - name: CODEENGINE_ARCH
    type: string
  - name: CODEENGINE_CIBUILD
    type: boolean
  - name: CODEENGINE_QUALITY
    type: string
  - name: CODEENGINE_RUN_ELECTRON_TESTS
    type: boolean
    default: false
  - name: CODEENGINE_RUN_BROWSER_TESTS
    type: boolean
    default: false
  - name: CODEENGINE_RUN_REMOTE_TESTS
    type: boolean
    default: false

jobs:
  - job: Windows_${{ parameters.CODEENGINE_ARCH }}
    displayName: Windows (${{ upper(parameters.CODEENGINE_ARCH) }})
    timeoutInMinutes: 90
    variables:
      CODEENGINE_ARCH: ${{ parameters.CODEENGINE_ARCH }}
      BUILDS_API_URL: $(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/
    templateContext:
      outputParentDirectory: $(Build.ArtifactStagingDirectory)/out
      outputs:
        - ${{ if or(eq(parameters.CODEENGINE_RUN_ELECTRON_TESTS, true), eq(parameters.CODEENGINE_RUN_BROWSER_TESTS, true), eq(parameters.CODEENGINE_RUN_REMOTE_TESTS, true)) }}:
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/crashes
            artifactName: crash-dump-windows-$(CODEENGINE_ARCH)-$(System.JobAttempt)
            displayName: Publish Crash Reports
            sbomEnabled: false
            isProduction: false
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/node_modules
            artifactName: node-modules-windows-$(CODEENGINE_ARCH)-$(System.JobAttempt)
            displayName: Publish Node Modules
            sbomEnabled: false
            isProduction: false
            condition: failed()
          - output: pipelineArtifact
            targetPath: $(Build.SourcesDirectory)/.build/logs
            artifactName: logs-windows-$(CODEENGINE_ARCH)-$(System.JobAttempt)
            displayName: Publish Log Files
            sbomEnabled: false
            isProduction: false
            condition: succeededOrFailed()
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/system-setup/VSCodeSetup-$(CODEENGINE_ARCH)-$(CODEENGINE_VERSION).exe
          artifactName: vscode_client_win32_$(CODEENGINE_ARCH)_setup
          displayName: Publish system setup
          sbomBuildDropPath: $(Agent.BuildDirectory)/VSCode-win32-$(CODEENGINE_ARCH)
          sbomPackageName: "Code Engine Windows $(CODEENGINE_ARCH) System Setup"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/user-setup/VSCodeUserSetup-$(CODEENGINE_ARCH)-$(CODEENGINE_VERSION).exe
          artifactName: vscode_client_win32_$(CODEENGINE_ARCH)_user-setup
          displayName: Publish user setup
          sbomBuildDropPath: $(Agent.BuildDirectory)/VSCode-win32-$(CODEENGINE_ARCH)
          sbomPackageName: "Code Engine Windows $(CODEENGINE_ARCH) User Setup"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/archive/VSCode-win32-$(CODEENGINE_ARCH)-$(CODEENGINE_VERSION).zip
          artifactName: vscode_client_win32_$(CODEENGINE_ARCH)_archive
          displayName: Publish archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/VSCode-win32-$(CODEENGINE_ARCH)
          sbomPackageName: "Code Engine Windows $(CODEENGINE_ARCH)"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/server/vscode-server-win32-$(CODEENGINE_ARCH).zip
          artifactName: vscode_server_win32_$(CODEENGINE_ARCH)_archive
          displayName: Publish server archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-win32-$(CODEENGINE_ARCH)
          sbomPackageName: "Code Engine Windows $(CODEENGINE_ARCH) Server"
          sbomPackageVersion: $(Build.SourceVersion)
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/out/web/vscode-server-win32-$(CODEENGINE_ARCH)-web.zip
          artifactName: vscode_web_win32_$(CODEENGINE_ARCH)_archive
          displayName: Publish web server archive
          sbomBuildDropPath: $(Agent.BuildDirectory)/vscode-server-win32-$(CODEENGINE_ARCH)-web
          sbomPackageName: "Code Engine Windows $(CODEENGINE_ARCH) Web"
          sbomPackageVersion: $(Build.SourceVersion)
      sdl:
        suppression:
          suppressionFile: $(Build.SourcesDirectory)\.config\guardian\.gdnsuppress
    steps:
      - template: ./steps/product-build-win32-compile.yml@self
        parameters:
          CODEENGINE_ARCH: ${{ parameters.CODEENGINE_ARCH }}
          CODEENGINE_CIBUILD: ${{ parameters.CODEENGINE_CIBUILD }}
          CODEENGINE_QUALITY: ${{ parameters.CODEENGINE_QUALITY }}
          CODEENGINE_RUN_ELECTRON_TESTS: ${{ parameters.CODEENGINE_RUN_ELECTRON_TESTS }}
          CODEENGINE_RUN_BROWSER_TESTS: ${{ parameters.CODEENGINE_RUN_BROWSER_TESTS }}
          CODEENGINE_RUN_REMOTE_TESTS: ${{ parameters.CODEENGINE_RUN_REMOTE_TESTS }}
